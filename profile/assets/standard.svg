<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="1200" height="310" role="img" aria-labelledby="t d">
  <title id="t">The Standard, v0.1 draft</title>
  <desc id="d">Open by default: code goes public when it's ready. Built for daily use: not for the demo. Shipped when ready: not before. Broken in public: fixed in public. Every unit answers to the same inspection.</desc>
  <defs>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
      .dim { fill: #8A939B; } .silver { fill: #D7DBDE; } .gold { fill: #D5AD52; } .garnet { fill: #E0325F; }
      .row { opacity: 0; animation: row .5s ease-out forwards; }
      .r1 { animation-delay: .3s; } .r2 { animation-delay: .7s; } .r3 { animation-delay: 1.1s; } .r4 { animation-delay: 1.5s; } .r5 { animation-delay: 2.1s; }
      @keyframes row { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        .row { animation: none !important; opacity: 1; }
      }
    </style>
    <clipPath id="panel"><rect width="1200" height="310" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#panel)">
    <rect width="1200" height="310" fill="#08090B"/>
    <rect x="0" y="0" width="1200" height="44" fill="#0E1013"/>
    <circle cx="28" cy="22" r="6" fill="#E0325F"/><circle cx="48" cy="22" r="6" fill="#D5AD52"/><circle cx="68" cy="22" r="6" fill="#52595F"/>
    <text x="600" y="27" class="mono dim" font-size="13" letter-spacing="3" text-anchor="middle">standard-v0.1 — fieldsfury labs</text>

    <text x="48" y="84" class="mono gold" font-size="15" font-weight="700" letter-spacing="2">$ cat standard.diff</text>

    <g class="row r1"><text x="48" y="124" class="mono garnet" font-size="16" font-weight="700">+</text>
      <text x="72" y="124" class="mono silver" font-size="16">Open by default.</text>
      <text x="420" y="124" class="mono dim" font-size="16">Code goes public when it's ready.</text></g>

    <g class="row r2"><text x="48" y="162" class="mono garnet" font-size="16" font-weight="700">+</text>
      <text x="72" y="162" class="mono silver" font-size="16">Built for daily use.</text>
      <text x="420" y="162" class="mono dim" font-size="16">Not for the demo.</text></g>

    <g class="row r3"><text x="48" y="200" class="mono garnet" font-size="16" font-weight="700">+</text>
      <text x="72" y="200" class="mono silver" font-size="16">Shipped when ready.</text>
      <text x="420" y="200" class="mono dim" font-size="16">Not before.</text></g>

    <g class="row r4"><text x="48" y="238" class="mono garnet" font-size="16" font-weight="700">+</text>
      <text x="72" y="238" class="mono silver" font-size="16">Broken in public.</text>
      <text x="420" y="238" class="mono dim" font-size="16">Fixed in public.</text></g>

    <g class="row r5"><text x="48" y="282" class="mono dim" font-size="16">every unit answers to the same inspection.</text></g>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="308.5" rx="17.5" fill="none" stroke="#D7DBDE" stroke-opacity=".12" stroke-width="1.5"/>
</svg>
